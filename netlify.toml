[build]
  command = "npm install --legacy-peer-deps && node netlify/build.js"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_EXPORT = "true"
  DEBUG = "*"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "/netlify/plugins/css-fix-plugin"
