<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Tutor - Cargando</title>
  <!-- Immediate loading of critical CSS -->
  <style>
    /* Minimal critical CSS */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    
    .dark body {
      background-color: #0f172a;
      color: #f8fafc;
    }
    
    .loader {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #3498db;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    
    p {
      font-size: 1rem;
      color: #64748b;
      text-align: center;
      max-width: 80%;
    }
    
    .dark p {
      color: #94a3b8;
    }
  </style>
  <!-- Load the reset CSS immediately -->
  <link rel="stylesheet" href="/netlify-tailwind-reset.css">
  <link rel="stylesheet" href="/critical.css">
  <script src="/netlify-css-loader.js"></script>
</head>
<body>
  <div class="loader"></div>
  <h1>Cargando Legal Tutor</h1>
  <p>Estamos preparando su experiencia legal. Un momento por favor...</p>
  
  <script>
    // Check user's preferred color scheme
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    
    // Redirect to the main app after a brief delay
    setTimeout(function() {
      window.location.href = '/';
    }, 1500);
    
    // Preload CSS files
    function preloadCSS(href) {
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'style';
      link.href = href;
      link.onload = function() {
        this.onload = null;
        this.rel = 'stylesheet';
      };
      document.head.appendChild(link);
    }
    
    // Preload the main CSS file
    preloadCSS('/static/css/css-src_styles_globals_css-node_modules_next_font_google_target_css-node_modules_next_font_go-06cadc.css');
  </script>
</body>
</html>
